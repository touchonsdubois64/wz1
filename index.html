<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winning Zone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&display=swap" rel="stylesheet">
</head>
<body>

<div class="app">

  <h1 class="title">Winning Zone</h1>

  <!-- ============ COMMANDES (haut de page) ============ -->
  <section class="controls">

    <div class="cell-fen">
      <label for="fen">FEN :</label>
      <input id="fen" type="text" spellcheck="false" autocomplete="off" autocapitalize="off"
             placeholder="8/8/8/8/8/8/8/8 w - - 0 1" aria-label="Code FEN">
      <div id="message" class="message" role="status" aria-live="polite"></div>
    </div>

    <div class="cell-play">
      <span class="label">Jeu :</span>
      <div class="button-group" aria-label="Choix du camp">
        <button type="button" class="mode-btn selected" data-mode="white" aria-pressed="true"
                title="Jouer les Blancs contre Stockfish"><img src="./pieces/alpha/wK.svg" alt="Blancs"></button>
        <button type="button" class="mode-btn" data-mode="black" aria-pressed="false"
                title="Jouer les Noirs contre Stockfish"><img src="./pieces/alpha/bK.svg" alt="Noirs"></button>
        <span class="dotted-sep" aria-hidden="true"></span>
        <button type="button" class="mode-btn" data-mode="analysis" aria-pressed="false"
                title="Mode analyse : jouer les deux camps"><img src="./images/king-bicolor.svg" alt="Mode analyse"></button>
      </div>
    </div>

    <div class="cell-palette">
      <div id="palette" class="palette" aria-label="Figurines à glisser sur l’échiquier"></div>
      <div id="shift" class="shift" aria-label="Déplacer toute la position">
        <span></span>
        <button type="button" class="shift-btn" data-dir="up" title="Monter la position"><svg viewBox="0 0 112 112" aria-hidden="true"><polygon points="56,9 104,93 8,93"/></svg></button>
        <span></span>
        <button type="button" class="shift-btn" data-dir="left" title="Décaler la position vers la gauche"><svg viewBox="0 0 112 112" aria-hidden="true"><polygon points="11,56 93,9 93,103"/></svg></button>
        <span class="shift-center"></span>
        <button type="button" class="shift-btn" data-dir="right" title="Décaler la position vers la droite"><svg viewBox="0 0 112 112" aria-hidden="true"><polygon points="99,56 15,9 15,103"/></svg></button>
        <span></span>
        <button type="button" class="shift-btn" data-dir="down" title="Descendre la position"><svg viewBox="0 0 112 112" aria-hidden="true"><polygon points="56,99 8,16 104,16"/></svg></button>
        <span></span>
      </div>
    </div>

    <div class="cell-start">
      <span class="label">Trait :</span>
      <div class="button-group">
        <button type="button" id="start-white" class="start-btn white" aria-pressed="false"
                title="Les Blancs ont le trait : figer la position et commencer"></button>
        <button type="button" id="start-black" class="start-btn black" aria-pressed="false"
                title="Les Noirs ont le trait : figer la position et commencer"></button>
        <span class="dotted-sep" aria-hidden="true"></span>
        <button type="button" id="zone" class="zone-btn" aria-pressed="false"
                title="Winning Zone (mode analyse) : 7 pièces au plus, tablebases (vert = gain, jaune = nulle, rose = perte) ; au-delà, évaluation de Stockfish sur les cases accessibles">
          <span class="z-win">+</span><span class="z-none"></span><span class="z-draw">=</span><span class="z-loss">&minus;</span>
        </button>
      </div>
    </div>

  </section>

  <!-- ============ ÉCHIQUIER ET ÉVALUATION ============ -->
  <section class="workspace">

    <div class="left">
      <div class="board-wrapper">
        <div class="rank-labels"></div>
        <div class="board-and-files">
          <div id="board"></div>
          <div id="zone-layer" class="zone-layer" aria-hidden="true"></div>
          <div class="file-labels"></div>
        </div>
        <div class="turn-indicators" aria-label="Camp au trait">
          <span id="turn-white" class="turn-circle white-circle" title="Blancs au trait"></span>
          <span id="turn-black" class="turn-circle black-circle" title="Noirs au trait"></span>
        </div>
      </div>

      <div class="navigation">
        <button id="restart" class="nav-square" type="button" title="Recommencer" aria-label="Recommencer"><img src="./images/restart.svg" alt=""></button>
        <button id="first" class="nav-square" type="button" title="Première position" aria-label="Première position"><img src="./images/to_start.svg" alt=""></button>
        <button id="previous" class="nav-square" type="button" title="Coup précédent" aria-label="Coup précédent"><img src="./images/backward.svg" alt=""></button>
        <button id="next" class="nav-square" type="button" title="Coup suivant" aria-label="Coup suivant"><img src="./images/forward.svg" alt=""></button>
        <button id="last" class="nav-square" type="button" title="Dernière position" aria-label="Dernière position"><img src="./images/to_end.svg" alt=""></button>
        <button id="flip" class="nav-square" type="button" title="Retourner l'échiquier" aria-label="Retourner l'échiquier"><img src="./images/flip.svg" alt=""></button>
      </div>

      <div id="moves" aria-label="Coups joués"></div>

      <div class="notation-control">
        <label for="notation">Notation :</label>
        <select id="notation">
          <option value="french">R D T F C</option>
          <option value="figurines" selected>♔♕♖♗♘</option>
          <option value="international">K Q R B N</option>
        </select>
      </div>
    </div>

    <aside class="right">
      <button id="eval-pill" class="eval-pill" type="button" aria-expanded="false" title="Afficher l’évaluation">
        <span class="pill-black"></span><span class="pill-white"></span>
      </button>
      <div id="eval-panel" class="eval-panel" aria-live="polite">
        <div id="eval-head" class="eval-head"></div>
        <div id="eval-moves" class="eval-moves"></div>
      </div>
    </aside>

  </section>

</div>

<div id="status" class="visually-hidden" aria-live="polite"></div>

<div id="promotion-modal" class="promotion-modal" hidden aria-hidden="true">
  <div class="promotion-box" role="dialog" aria-modal="true" aria-labelledby="promotion-title">
    <div id="promotion-title" class="promotion-title">Choisissez la pièce</div>
    <div id="promotion-choices" class="promotion-choices"></div>
    <button id="promotion-cancel" class="promotion-cancel" type="button">Annuler</button>
  </div>
</div>

<script type="module" src="/src/app.js"></script>
</body>
</html>
